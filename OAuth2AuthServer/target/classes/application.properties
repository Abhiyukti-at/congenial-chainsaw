spring.application.name=${AUTH_SERVER_NAME:Authorization Server}
server.port=${AS_SERVER_PORT:9000}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:Trace}
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bank_app_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Nikita@123!}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=${LOGGING_PATTERN:%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){green} %clr(%-5level){yellow} %clr(%logger{36}){cyan} - %clr(%msg){faint}%n}